<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fleet Commander</title>
    <!-- Shown from the moment the window opens, straight off disk, while we wait
         for the dev server to answer. Without it the window is blank white for
         as long as Vite takes to serve index.html (a cold transform can be
         30s+). Deliberately a copy of index.html's boot screen rather than a
         shared file: this one must load with zero dependencies. -->
    <style>
      html, body { margin: 0; height: 100%; background: #dde4f0; }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background: radial-gradient(circle at 50% 30%, #fbfcfe 0%, #dde4f0 72%);
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        -webkit-app-region: drag;
      }
      .boot__title {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #1b2433;
      }
      .boot__status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        color: #5a6680;
      }
      .boot__spinner {
        width: 15px;
        height: 15px;
        border: 2px solid rgba(90, 102, 128, 0.3);
        border-top-color: #5a6680;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot__title">Fleet Commander</div>
      <div class="boot__status"><span class="boot__spinner"></span><span>Starting the dev server…</span></div>
    </div>
  </body>
</html>
