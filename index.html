<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/fleet.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleet Commander</title>
    <!-- Static boot screen. The React <Splash> can only appear once the whole
         module graph has been fetched (slow on a cold Vite dep-optimize), so
         paint something immediately instead of a white window. main.tsx removes
         this the moment React mounts; the gradient matches splash.css so the
         handover is invisible. -->
    <style>
      html, body { margin: 0; height: 100%; background: #dde4f0; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 3000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background: radial-gradient(circle at 50% 30%, #fbfcfe 0%, #dde4f0 72%);
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        -webkit-app-region: drag; /* frameless window is still draggable while booting */
      }
      #boot .boot__title {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #1b2433;
      }
      #boot .boot__status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        color: #5a6680;
      }
      #boot .boot__spinner {
        width: 15px;
        height: 15px;
        border: 2px solid rgba(90, 102, 128, 0.3);
        border-top-color: #5a6680;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot__title">Fleet Commander</div>
      <div class="boot__status"><span class="boot__spinner"></span><span>Loading…</span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
